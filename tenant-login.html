<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Login - Ivory Apartment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .form-group.checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .form-group.checkbox input {
            width: auto;
            margin-right: 0.5rem;
        }

        .form-group.checkbox label {
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: #2980b9;
        }

        .form-link {
            text-align: center;
            margin-top: 1rem;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .form-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .form-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message {
            background-color: #e8f5e9;
            border: 1px solid #81c784;
            color: #2e7d32;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .tab-buttons {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid #ecf0f1;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #2c3e50;
            border-bottom-color: #3498db;
        }

        .tab-btn:hover {
            color: #2c3e50;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #ecf0f1;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin: 0.5rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .demo-note {
            background-color: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .demo-note p {
            color: #1565c0;
            margin-bottom: 0.5rem;
        }

        .demo-note strong {
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem;
                margin: 1rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .tab-buttons {
                margin-bottom: 1.5rem;
            }

            .tab-btn {
                padding: 0.75rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏠 Tenant Portal</h1>
            <p>Ivory Apartment - Find Your Home</p>
        </div>

        <!-- Tab Buttons -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="loginTab" class="tab-content active">
            <div id="loginError" class="error-message"></div>
            <div id="loginSuccess" class="success-message"></div>

            <form id="tenantLoginForm" onsubmit="handleTenantLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required autofocus>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="rememberTenant">
                    <label for="rememberTenant">Remember me</label>
                </div>
                <button type="submit" class="btn-login">Login to Portal</button>
                <p class="form-link">Don't have an account? <a onclick="switchTab('signup')">Sign up here</a></p>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signupTab" class="tab-content">
            <div id="signupError" class="error-message"></div>
            <div id="signupSuccess" class="success-message"></div>

            <form id="tenantSignupForm" onsubmit="handleTenantSignup(event)">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="Enter your phone number" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password (min 6 chars)" required>
                </div>
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn-login">Create Account</button>
                <p class="form-link">Already have an account? <a onclick="switchTab('login')">Login here</a></p>
            </form>
        </div>

        <div class="back-link">
            <a href="home.html">← Back to Home</a>
            <a href="index.html">← Browse Properties</a>
        </div>
    </div>

    <script>
        // Switch between tabs
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const tabButtons = document.querySelectorAll('.tab-btn');

            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                tabButtons[0].classList.add('active');
                tabButtons[1].classList.remove('active');
                document.getElementById('loginEmail').focus();
            } else {
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
                tabButtons[0].classList.remove('active');
                tabButtons[1].classList.add('active');
                document.getElementById('signupName').focus();
            }
        }

        // Handle Tenant Login
        function handleTenantLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberTenant').checked;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');

            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('ivoryUsers')) || [];

            // Find user
            const user = users.find(u => u.email === email);

            if (!user) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ Email not found. Please sign up first.';
                successDiv.style.display = 'none';
                return;
            }

            if (user.password !== password) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ Incorrect password. Please try again.';
                successDiv.style.display = 'none';
                return;
            }

            // Login successful
            const currentUser = {
                id: user.id,
                name: user.name,
                email: user.email,
                phone: user.phone
            };

            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            if (rememberMe) {
                localStorage.setItem('tenantRemembered', 'true');
                localStorage.setItem('rememberedEmail', email);
            }

            errorDiv.style.display = 'none';
            successDiv.style.display = 'block';
            successDiv.textContent = `✅ Welcome back, ${currentUser.name.split(' ')[0]}! Redirecting...`;
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // Handle Tenant Signup
        function handleTenantSignup(event) {
            event.preventDefault();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const errorDiv = document.getElementById('signupError');
            const successDiv = document.getElementById('signupSuccess');

            // Get existing users
            let users = JSON.parse(localStorage.getItem('ivoryUsers')) || [];

            // Validate inputs
            if (!name || !email || !phone || !password || !confirmPassword) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ Please fill in all fields';
                successDiv.style.display = 'none';
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ Passwords do not match';
                successDiv.style.display = 'none';
                return;
            }

            if (password.length < 6) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ Password must be at least 6 characters long';
                successDiv.style.display = 'none';
                return;
            }

            // Check if email already exists
            if (users.some(u => u.email === email)) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ Email already registered. Please login or use a different email.';
                successDiv.style.display = 'none';
                return;
            }

            // Create new user
            const newUser = {
                id: Date.now(),
                name: name,
                email: email,
                phone: phone,
                password: password
            };

            users.push(newUser);
            localStorage.setItem('ivoryUsers', JSON.stringify(users));

            // Auto login
            const currentUser = {
                id: newUser.id,
                name: newUser.name,
                email: newUser.email,
                phone: newUser.phone
            };

            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'block';
            successDiv.textContent = `✅ Account created! Welcome, ${currentUser.name.split(' ')[0]}! Redirecting to portal...`;
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // Check if already logged in
        window.addEventListener('load', function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'index.html';
            }

            // Check for remembered tenant
            if (localStorage.getItem('tenantRemembered')) {
                const rememberedEmail = localStorage.getItem('rememberedEmail');
                if (rememberedEmail) {
                    document.getElementById('loginEmail').value = rememberedEmail;
                    document.getElementById('loginPassword').focus();
                }
            }
        });

        // Close error messages on input
        document.addEventListener('input', function(e) {
            if (e.target.tagName === 'INPUT') {
                document.getElementById('loginError').style.display = 'none';
                document.getElementById('signupError').style.display = 'none';
            }
        });
    </script>
</body>
</html>
