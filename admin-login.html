<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ivory Apartment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: #2980b9;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            background-color: #e8f5e9;
            border: 1px solid #81c784;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .demo-credentials p {
            color: #2e7d32;
            margin-bottom: 0.5rem;
        }

        .demo-credentials code {
            background-color: #f5f5f5;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #333;
        }

        .form-group.checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .form-group.checkbox input {
            width: auto;
            margin-right: 0.5rem;
        }

        .form-group.checkbox label {
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .error-message {
            background-color: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem;
                margin: 1rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏢 Admin Portal</h1>
            <p>Ivory Apartment Management System</p>
        </div>

        <div class="demo-credentials">
            <p><strong>📋 Demo Credentials:</strong></p>
            <p>Email: <code>admin@ivoryapartment.com</code></p>
            <p>Password: <code>admin123</code></p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <input type="email" id="adminEmail" placeholder="admin@ivoryapartment.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            <div class="form-group checkbox">
                <input type="checkbox" id="rememberAdmin">
                <label for="rememberAdmin">Remember me</label>
            </div>
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>

        <div class="back-link">
            <a href="home.html">← Back to Main Website</a>
            <br><br>
            <a href="index.html">← Tenant Portal</a>
            <br><br>
            <a href="admins.html" style="color: #e74c3c; font-weight: bold;">🔐 Admin Management</a>
        </div>
    </div>

    <script>
        function handleAdminLogin(event) {
            event.preventDefault();

            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const rememberMe = document.getElementById('rememberAdmin').checked;
            const errorDiv = document.getElementById('errorMessage');

            // Demo credentials
            const validEmail = 'admin@ivoryapartment.com';
            const validPassword = 'admin123';

            if (email === validEmail && password === validPassword) {
                // Set session
                sessionStorage.setItem('adminLoggedIn', 'true');
                
                // Remember me functionality
                if (rememberMe) {
                    localStorage.setItem('adminRemembered', 'true');
                }
                
                // Redirect to admin dashboard
                window.location.href = 'admin.html';
            } else {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Invalid email or password. Please use the demo credentials.';
                document.getElementById('adminPassword').value = '';
            }
        }

        // Check if user is already logged in
        if (sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'admin.html';
        }

        // Check for remembered admin
        if (localStorage.getItem('adminRemembered')) {
            document.getElementById('adminEmail').value = 'admin@ivoryapartment.com';
        }
    </script>
</body>
</html>
